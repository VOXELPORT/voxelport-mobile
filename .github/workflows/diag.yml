name: Diagnose release

# Runs the release workflow's fetch and signature checks without stopping at the first failure, and reports every
# result as a visible note, to find out where the release workflow dies.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe the download
        run: |
          say() { echo "::notice::$*"; }
          code=$(curl -sS -o android.json -w '%{http_code}' https://voxelport.in/dl/android.json 2>&1)
          say "feed http=$code size=$(wc -c < android.json 2>/dev/null)"
          say "feed: $(head -c 300 android.json 2>/dev/null | tr '\n' ' ')"
          URL=$(jq -r .url android.json 2>&1)
          say "url=$URL"
          code=$(curl -sS -o VoxelPort.apk -w '%{http_code} %{content_type} %{size_download}' "https://voxelport.in${URL}" 2>&1)
          say "apk $code"
          say "apk file: $(ls -l VoxelPort.apk 2>&1)"
          say "apk head: $(head -c 60 VoxelPort.apk 2>/dev/null | od -c | head -2 | tr '\n' ' ')"
          say "apk sha: $(sha256sum VoxelPort.apk 2>&1)"
          say "feed sha: $(jq -r .sha256 android.json 2>&1)"
      - name: Probe the signing tool
        run: |
          say() { echo "::notice::$*"; }
          say "java: $(command -v java || echo none) | apksigner: $(command -v apksigner || echo none) | jq: $(command -v jq || echo none)"
          say "ANDROID_HOME=${ANDROID_HOME:-unset} build-tools: $(ls "${ANDROID_HOME:-/nonexistent}/build-tools" 2>&1 | tr '\n' ' ')"
          AS=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          say "apksigner path: ${AS:-none}"
          if [ -n "$AS" ]; then say "signer: $("$AS" verify --print-certs VoxelPort.apk 2>&1 | tr '\n' ' ' | head -c 600)"; fi
