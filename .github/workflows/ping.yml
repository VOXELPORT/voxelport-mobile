name: Ping

# A minimal job, to tell a problem with this repository's Actions from a problem in the release workflow.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Say hello
        run: echo "hello from the runner"
      - name: Reach voxelport.in
        run: curl -sS -o /dev/null -w "android.json HTTP %{http_code}\n" https://voxelport.in/dl/android.json
